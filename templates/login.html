<!DOCTYPE html>
<html>
<head>
    <title>Login - Codelian Poynt</title>
</head>

<body>

    <h1>Codelian Poynt Login</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">

        <div>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <br>

        <div>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Log In
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Create one</a>
    </p>

</body>
</html>
