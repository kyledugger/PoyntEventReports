{% extends "base.html" %}

{% block title %}Forgot Password - Food Truck Works{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-5-tablet is-4-desktop">
                <div class="box">
                    <h1 class="title is-4">Reset your password</h1>
                    <p class="mb-4">Enter your account email address.</p>
                    <form method="post">
                        <div class="field">
                            <label class="label" for="email">Email</label>
                            <div class="control">
                                <input class="input" type="email" id="email" name="email"
                                       autocomplete="email" required autofocus>
                            </div>
                        </div>
                        <button type="submit" class="button is-primary is-fullwidth">
                            Send Reset Link
                        </button>
                    </form>
                    <p class="has-text-centered mt-4"><a href="/login">Return to login</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
