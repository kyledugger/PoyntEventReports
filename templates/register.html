<!DOCTYPE html>
<html>
<head>
    <title>Create Account - Codelian Poynt</title>
</head>

<body>

    <h1>Create Account</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">

        <div>
            <label for="organization_name">Organization Name:</label>
            <input
                type="text"
                id="organization_name"
                name="organization_name"
                value="{{ organization_name or '' }}"
                required
                autofocus
            >
        </div>

        <br>

        <div>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ email or '' }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <br>

        <button type="submit">Create Account</button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Log in</a>
    </p>

</body>
</html>
