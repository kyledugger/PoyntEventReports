{% extends "base.html" %}

{% block title %}Reset Password - Food Truck Works{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-5-tablet is-4-desktop">
                <div class="box">
                    <h1 class="title is-4">Choose a new password</h1>
                    {% if error %}
                        <div class="notification is-danger is-light">{{ error }}</div>
                    {% endif %}
                    <form method="post">
                        <div class="field">
                            <label class="label" for="password">New password</label>
                            <div class="control">
                                <input class="input" type="password" id="password" name="password"
                                       minlength="10" maxlength="128" autocomplete="new-password"
                                       required autofocus>
                            </div>
                        </div>
                        <div class="field">
                            <label class="label" for="confirm_password">Confirm password</label>
                            <div class="control">
                                <input class="input" type="password" id="confirm_password"
                                       name="confirm_password" minlength="10" maxlength="128"
                                       autocomplete="new-password" required>
                            </div>
                        </div>
                        <button type="submit" class="button is-primary is-fullwidth">
                            Reset Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
