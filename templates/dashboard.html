<!DOCTYPE html>
<html>
<head>
    <title>Codelian Poynt Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .header-text {
            float: left;            
            display: inline;

        }        

        .logout-block {
            float: right;            
            display: inline;

        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }


    </style>    
</head>

<body>

    <h1>Event Manager App</h1>

    <div>
        <div class="header-text">
            Welcome, {{ user.email }}
        </div>
        <div class="logout-block">
            <form method="post" action="/logout">
                <button type="submit">
                    Log Out
                </button>
            </form>
        </div>  
    </div>

    <div class="clearfix"></div>

    <hr>

    {% if poynt_connection %}

        <p>
            Poynt Connection:
            <strong>Connected</strong>
            {{ user.email }}
        </p>
    <hr>



        <p>
            <a href="/poynt/orders">
                <button type="button">
                    <strong>Orders Report</Strong>
                </button>
            </a>
        </p>

        <p>
            <a href="/poynt/catalog">
                <button type="button">
                    Load Poynt Catalog
                </button>
            </a>
        </p> 
        
        <hr>

        <p>
            <a href="/oauth/start">
                <button type="button">
                    Reconnect Poynt
                </button>
            </a>
        </p>

    {% else %}

        <p>
            Poynt Connection:
            <strong>Not connected</strong>
        </p>

        <p>
            <a href="/oauth/start">
                <button type="button">
                    Connect Poynt
                </button>
            </a>
        </p>

    {% endif %}
  
</body>
</html>
